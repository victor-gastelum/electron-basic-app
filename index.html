<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login & Registro</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .container { max-width: 300px; margin: auto; }
    input, button { width: 100%; margin: 8px 0; padding: 8px; }
    .message { margin-top: 10px; }
    .tabs { display: flex; margin-bottom: 20px; }
    .tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border: 1px solid #ccc; }
    .tab.active { background: #eee; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <div class="tab active" id="loginTab">Login</div>
      <div class="tab" id="registerTab">Registro</div>
    </div>
    <form id="loginForm">
      <h2>Login</h2>
      <input type="text" id="loginUsername" placeholder="Usuario" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
      <div class="message" id="loginMessage"></div>
    </form>
    <form id="registerForm" style="display:none;">
      <h2>Registro</h2>
      <input type="text" id="registerUsername" placeholder="Usuario" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="submit">Registrar</button>
      <div class="message" id="registerMessage"></div>
    </form>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
